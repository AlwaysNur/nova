name: Notification Spam Test

on:
  workflow_dispatch:

jobs:
  spam-comments:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Post Loop Comments via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in {1..50}; do
            gh issue comment 1 --body "Notification test loop $i from GitHub Actions Bot"
            sleep 0.5 # Optional tiny delay to pace the notifications
          done
